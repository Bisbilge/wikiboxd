{% extends 'base.html' %}

{% block title %}Giriş Yap - Wikiboxd{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card-custom p-4">
                <h3 class="text-center mb-1" style="font-family: 'Linux Libertine', Georgia, serif;">Giriş Yap</h3>
                <p class="text-center text-muted mb-4" style="font-size: 0.88rem;">Wikiboxd hesabına giriş yap</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Kullanıcı Adı</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Şifre</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-brand w-100 mt-2">Giriş Yap</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">
                        <a href="{% url 'users:password_reset' %}">Şifremi unuttum</a>
                    </small>
                </div>
                <div class="text-center mt-3 pt-3" style="border-top: 1px solid #eaecf0;">
                    <small class="text-muted">
                        Hesabın yok mu? <a href="{% url 'users:register' %}">Kayıt Ol</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

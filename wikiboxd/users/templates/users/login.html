{% extends 'base.html' %}

{% block title %}Giriş Yap - Wikiboxd{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card card-custom p-4">
                <h3 class="text-white text-center mb-4">Giriş Yap</h3>
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted">Kullanıcı Adı</label>
                        <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Şifre</label>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <button type="submit" class="btn btn-brand w-100 mt-3">GİRİŞ YAP</button>
                </form>
                
                <div class="text-center mt-3">
                    <small style="color: #9ab;">
                        <a href="{% url 'users:password_reset' %}" class="text-decoration-none" style="color: #40bcf4;">Şifremi unuttum</a>
                    </small>
                </div>
                <div class="text-center mt-3 pt-3 border-top" style="border-color: #455568 !important;">
                    <small style="color: #9ab;">
                        Hesabın yok mu? <a href="{% url 'users:register' %}" class="text-decoration-none" style="color: #00E054;">Kayıt Ol</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

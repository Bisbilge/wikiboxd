{% extends 'base.html' %}

{% block title %}Şifre Sıfırlandı - Wikiboxd{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 text-center">
                <i class="bi bi-check-circle display-1 mb-3" style="color: #00E054;"></i>
                <h3 class="text-white mb-3">Şifren Yenilendi!</h3>
                <p class="mb-4" style="color: #9ab; font-size: 0.95rem;">
                    Şifren başarıyla değiştirildi. Artık yeni şifrenle giriş yapabilirsin.
                </p>
                <a href="{% url 'users:login' %}" class="btn btn-brand w-100 mt-2">GİRİŞ YAP</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

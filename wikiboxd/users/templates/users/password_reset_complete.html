{% extends 'base.html' %}

{% block title %}Şifre Sıfırlandı - Wikiboxd{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card-custom p-4 text-center">
                <i class="bi bi-check-circle display-3 mb-3" style="color: #3366cc;"></i>
                <h4 class="mb-3" style="font-family: 'Linux Libertine', Georgia, serif;">Şifren Yenilendi!</h4>
                <p class="text-muted mb-4" style="font-size: 0.92rem;">
                    Şifren başarıyla değiştirildi. Artık yeni şifrenle giriş yapabilirsin.
                </p>
                <a href="{% url 'users:login' %}" class="btn btn-brand w-100">Giriş Yap</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

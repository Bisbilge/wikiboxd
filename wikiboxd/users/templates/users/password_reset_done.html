{% extends 'base.html' %}

{% block title %}E-posta Gönderildi - Wikiboxd{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card-custom p-4 text-center">
                <i class="bi bi-envelope-check display-3 mb-3" style="color: #3366cc;"></i>
                <h4 class="mb-3" style="font-family: 'Linux Libertine', Georgia, serif;">E-posta Gönderildi</h4>
                <p class="text-muted" style="font-size: 0.92rem;">
                    Eğer bu e-posta adresiyle bir hesap varsa, şifreni sıfırlaman için bağlantı gönderildi.
                </p>
                <p class="text-muted mb-0" style="font-size: 0.88rem;">
                    Spam klasörünü de kontrol etmeyi unutma.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

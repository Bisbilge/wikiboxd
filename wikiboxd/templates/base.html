<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wikiboxd{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Letterboxd Özel Renk Paleti ve Tipografi */
        body {
            background-color: #14181C; /* Orijinal derin arkaplan */
            color: #9ab; /* Okunabilir gri metin rengi */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        h1, h2, h3, h4, h5, h6, .text-white {
            color: #ffffff !important;
        }
        .navbar {
            background-color: #14181C !important;
            border-bottom: 1px solid #2C3440;
        }
        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }
        .nav-link {
            color: #9ab !important;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: color 0.2s;
        }
        .nav-link:hover {
            color: #ffffff !important;
        }
        .btn-brand {
            background-color: #00E054; /* Orijinal Letterboxd Yeşili */
            color: #14181C;
            font-weight: bold;
            border: none;
            transition: background-color 0.2s;
        }
        .btn-brand:hover {
            background-color: #00b343;
            color: #ffffff;
        }
        .card-custom {
            background-color: #2C3440; /* Kart arkaplanı */
            border: 1px solid #455568;
            border-radius: 6px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card-custom:hover {
            transform: scale(1.02);
            border-color: #00E054; /* Üzerine gelince yeşil parlasın */
            cursor: pointer;
        }
        .card-title {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
        }
        footer {
            border-top: 1px solid #2C3440;
            background-color: #14181C;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg py-3">
        <div class="container">
            <a class="navbar-brand text-white" href="/">
                <i class="bi bi-box-fill" style="color: #00E054;"></i> Wikiboxd
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list fs-1" style="color: #9ab;"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3"><a class="nav-link" href="/">Makaleler</a></li>
                    
                    {% if user.is_authenticated %}
                        <li class="nav-item me-3">
                            <a class="nav-link" href="{% url 'users:profile' %}" style="color: #00E054 !important;">
                                <i class="bi bi-person-fill"></i> {{ user.username }}
                            </a>
                        </li>
                        <li class="nav-item ms-2">
                            <form action="{% url 'users:logout' %}" method="post" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-secondary btn-sm px-3 py-2 text-white border-0">Çıkış</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'users:login' %}">Giriş Yap</a></li>
                        <li class="nav-item ms-3"><a class="btn btn-brand btn-sm px-3 py-2" href="{% url 'users:register' %}">Hesap Oluştur</a></li>
                    {% endif %}
                    
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="py-4 mt-5 text-center">
        <div class="container">
            <p class="mb-0" style="font-size: 0.85rem;">© 2026 Wikiboxd. Galatasaray Üniversitesi Proje Ödevi.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
